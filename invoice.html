<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Hóa đơn - GymPro</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .invoice-box {
        max-width: 600px;
        margin: 2rem auto;
        background: white;
        padding: 3rem;
        border-radius: 12px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }
      .invoice-box::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: var(--primary);
      }
      .status-badge {
        background: #dcfce7;
        color: #166534;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="invoice-box">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: start;
          margin-bottom: 2rem;
        "
      >
        <div>
          <h1 style="color: var(--primary)">GymPro</h1>
          <p style="color: var(--text-gray); font-size: 0.8rem">
            Quận 9, TP. Hồ Chí Minh
          </p>
        </div>
        <span class="status-badge">ĐÃ THANH TOÁN</span>
      </div>

      <div style="margin-bottom: 2rem">
        <p style="color: var(--text-gray)">Mã hóa đơn: <b>#INV-2026001</b></p>
        <p style="color: var(--text-gray)">Ngày: 07/05/2026</p>
      </div>

      <div
        style="
          border-top: 1px dashed #cbd5e1;
          border-bottom: 1px dashed #cbd5e1;
          padding: 1.5rem 0;
          margin-bottom: 1.5rem;
        "
      >
        <p><b>Khách hàng:</b> Nguyễn Văn A</p>
        <p><b>Dịch vụ:</b> Yoga Zen Premium (6 tháng)</p>
        <p><b>Ngày bắt đầu:</b> 10/05/2026</p>
      </div>

      <div style="text-align: right; margin-bottom: 2rem">
        <p style="font-size: 0.9rem">Thành tiền</p>
        <h2 style="color: var(--primary)">2.800.000 VNĐ</h2>
      </div>

      <div
        style="
          text-align: center;
          background: #f8fafc;
          padding: 1.5rem;
          border-radius: 8px;
        "
      >
        <p style="font-size: 0.8rem; margin-bottom: 10px">
          Quét để kiểm tra thông tin
        </p>
        <div
          style="
            width: 120px;
            height: 120px;
            background: #333;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border-radius: 8px;
          "
        >
          QR Code
        </div>
      </div>

      <div
        style="
          margin-top: 2.5rem;
          display: flex;
          gap: 1rem;
          justify-content: center;
        "
      >
        <button class="btn btn-outline" onclick="window.print()">
          In hóa đơn
        </button>
        <button class="btn btn-primary">Tải PDF</button>
        <a
          href="index.html"
          class="btn btn-outline"
          style="border-color: #cbd5e1; color: #64748b"
          >Hoàn tất</a
        >
      </div>
    </div>
  </body>
</html>
