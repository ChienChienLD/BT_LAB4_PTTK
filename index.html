<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký khóa tập - GymPro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="sidebar">
      <div class="logo">GymPro</div>
      <ul class="menu-list">
        <li class="menu-item">
          <a href="index.html" class="menu-link active">Đăng ký khóa tập</a>
        </li>
        <li class="menu-item">
          <a href="search.html" class="menu-link">Tra cứu dịch vụ</a>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <header>
        <h2>Đăng ký khóa tập mới</h2>
        <div class="user-info">Xin chào!</div>
      </header>

      <section class="card">
        <form action="payment.html">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem">
            <div class="column">
              <h3 style="margin-bottom: 1.5rem; color: var(--primary)">
                Thông tin khách hàng
              </h3>
              <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" placeholder="Nguyễn Văn A" required />
              </div>
              <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" placeholder="0901 234 567" required />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="email@example.com" />
              </div>
            </div>

            <div class="column">
              <h3 style="margin-bottom: 1.5rem; color: var(--primary)">
                Gói tập đăng ký
              </h3>
              <div class="form-group">
                <label>Chọn môn tập</label>
                <select id="course">
                  <option value="500000">Gym (Thể hình) - 500k/tháng</option>
                  <option value="600000">Yoga - 600k/tháng</option>
                  <option value="800000">Boxing - 800k/tháng</option>
                  <option value="900000">Pilates - 900k/tháng</option>
                </select>
              </div>
              <div class="form-group">
                <label>Gói dịch vụ</label>
                <select id="package">
                  <option value="1">Gói Standard (1 tháng)</option>
                  <option value="6">Gói VIP (6 tháng)</option>
                  <option value="12">Gói Premium (12 tháng)</option>
                </select>
              </div>
              <div class="form-group">
                <label>Ngày bắt đầu</label>
                <input type="date" />
              </div>
              <div
                style="
                  background: var(--bg-light);
                  padding: 1rem;
                  border-radius: 8px;
                  margin-bottom: 1rem;
                "
              >
                <span style="font-size: 0.9rem; color: var(--text-dark)"
                  >Tổng tiền dự tính:</span
                >
                <h2 id="total-price" style="color: var(--primary)">
                  500.000 VNĐ
                </h2>
              </div>
            </div>
          </div>

          <div
            style="
              margin-top: 2rem;
              display: flex;
              gap: 1rem;
              justify-content: flex-end;
            "
          >
            <a href="search.html" class="btn btn-outline">Tra cứu dịch vụ</a>
            <button type="reset" class="btn btn-danger">Hủy</button>
            <button type="submit" class="btn btn-primary">Tiếp tục</button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const courseSelect = document.getElementById("course");
      const packageSelect = document.getElementById("package");
      const priceDisplay = document.getElementById("total-price");

      function calculatePrice() {
        const coursePrice = parseInt(courseSelect.value);
        const months = parseInt(packageSelect.value);
        const total = coursePrice * months;
        priceDisplay.textContent = total.toLocaleString("vi-VN") + " VNĐ";
      }

      courseSelect.addEventListener("change", calculatePrice);
      packageSelect.addEventListener("change", calculatePrice);
      calculatePrice();
    </script>
  </body>
</html>
