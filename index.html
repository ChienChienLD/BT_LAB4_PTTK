<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký khóa tập - GymPro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="sidebar">
      <div class="logo">GymPro</div>
      <ul class="menu-list">
        <li class="menu-item">
          <a href="index.html" class="menu-link active">Đăng ký khóa tập</a>
        </li>
        <li class="menu-item">
          <a href="search.html" class="menu-link">Tra cứu dịch vụ</a>
        </li>
        <li class="menu-item"><a href="#" class="menu-link">Lịch tập</a></li>
        <li class="menu-item"><a href="#" class="menu-link">Cài đặt</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <header>
        <h2>Đăng ký khóa tập mới</h2>
        <div class="user-info">Xin chào!</div>
      </header>

      <section class="card">
        <form action="payment.html">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem">
            <!-- Thông tin khách hàng -->
            <div class="column">
              <h3 style="margin-bottom: 1.5rem; color: var(--primary)">
                Thông tin khách hàng
              </h3>
              <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" placeholder="Nguyễn Văn A" required />
              </div>
              <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" placeholder="0901 234 567" required />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="email@example.com" />
              </div>
            </div>

            <!-- Thông tin dịch vụ -->
            <div class="column">
              <h3 style="margin-bottom: 1.5rem; color: var(--primary)">
                Gói tập đăng ký
              </h3>
              <div class="form-group">
                <label>Chọn môn tập</label>
                <select>
                  <option>Gym (Thể hình)</option>
                  <option>Yoga</option>
                  <option>Boxing</option>
                  <option>Pilates</option>
                </select>
              </div>
              <div class="form-group">
                <label>Gói dịch vụ</label>
                <select>
                  <option>Gói Standard (1 tháng)</option>
                  <option>Gói VIP (6 tháng)</option>
                  <option>Gói Premium (12 tháng)</option>
                </select>
              </div>
              <div class="form-group">
                <label>Ngày bắt đầu</label>
                <input type="date" />
              </div>
              <div
                style="
                  background: var(--bg-light);
                  padding: 1rem;
                  border-radius: 8px;
                  margin-bottom: 1rem;
                "
              >
                <span style="font-size: 0.9rem; color: var(--text-dark)"
                  >Tổng tiền dự tính:</span
                >
                <h2 style="color: var(--primary)">1.200.000 VNĐ</h2>
              </div>
            </div>
          </div>

          <div
            style="
              margin-top: 2rem;
              display: flex;
              gap: 1rem;
              justify-content: flex-end;
            "
          >
            <a href="search.html" class="btn btn-outline">Tra cứu dịch vụ</a>
            <button type="reset" class="btn btn-danger">Hủy</button>
            <button type="submit" class="btn btn-primary">Tiếp tục</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
